name: main-build CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - master        # Build on push to master
      - develop       # Build on push to develop
      - 'feature/*'   # Build on feature branches
      - 'release/*'   # Build on release branches
  pull_request:
    branches:
      - master
      - develop
      - 'feature/*'
      - 'release/*'

jobs:
  build:
    runs-on: ${{ matrix.os }}  # This is where the environment is specified

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]  # .NET Framework requires Windows
        dotnet-version: ['6.x', '8.x', '4.8.x']  # Different versions of .NET

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup .NET SDK for .NET Standard/.NET 8 projects
      - name: Setup .NET Core SDK
        if: matrix.dotnet-version != '4.8.x'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # Setup .NET Framework on Windows for 4.8.1 project
      - name: Setup .NET Framework SDK (Windows)
        if: matrix.os == 'windows-latest' && matrix.dotnet-version == '4.8.x'
        run: |
          choco install dotnetfx --version=4.8.1

      # Restore dependencies
      - name: Restore dependencies
        run: |
          dotnet restore ./src/DataAccess.AzureStorage.sln
        if: matrix.dotnet-version != '4.8.x'

      # Restore dependencies for .NET Framework
      - name: Restore dependencies for .NET Framework (Windows)
        run: |
          nuget restore ./src/DataAccess.AzureStorage.sln
        if: matrix.os == 'windows-latest' && matrix.dotnet-version == '4.8.x'

      # Build .NET Standard and .NET Core/8 projects
      - name: Build .NET projects (Standard/Core/8)
        run: dotnet build --configuration Release --no-restore ./src/DataAccess.AzureStorage.sln
        if: matrix.dotnet-version != '4.8.x'

      # Build .NET Framework project
      - name: Build .NET Framework project (Windows)
        run: |
          msbuild ./src/DataAccess.AzureStorage.sln /p:Configuration=Release
        if: matrix.os == 'windows-latest' && matrix.dotnet-version == '4.8.x'

      # Optional: Run unit tests for .NET Standard/.NET Core/8 if applicable
      - name: Run tests (for .NET Standard/.NET Core)
        run: dotnet test --configuration Release --no-build
        if: matrix.dotnet-version != '4.8.x'
